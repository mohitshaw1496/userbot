services:
  - type: worker
    name: private-telegram-userbot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: telegram-userbot-data
      mountPath: /var/data
      sizeGB: 1
