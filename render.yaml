
services:
  - type: worker
    name: telegram-account-manager
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python manager_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: manager-data
      mountPath: /var/data
      sizeGB: 1
